# Dashboards da plataforma, publicados como ConfigMaps no namespace monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Plataforma
configMapGenerator:
  - name: dashboard-recursos-pods
    files:
      - recursos-pods.json
