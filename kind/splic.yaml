# Cluster local "splic" para a demo da entrevista
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: splic
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      # Portas do host para expor a API de clima e o Grafana via NodePort
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30300
        hostPort: 30300
        protocol: TCP
  - role: worker
