# Cluster local "splic"
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: splic
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      # Portas do host ligadas a NodePorts: 30080 para aplicações, 30300 para o Grafana
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30300
        hostPort: 30300
        protocol: TCP
  - role: worker
