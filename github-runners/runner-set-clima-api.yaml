# Scale set de runners do repositório clima-api.
# O nome da release do Helm (arc-splic) é o valor usado em "runs-on" no workflow.
githubConfigUrl: https://github.com/marceloluizfranca/clima-api

# Secret criado pelo install.sh com o token do GitHub (nunca versionado)
githubConfigSecret: github-token

# Escala a zero quando não há jobs: um pod por job, descartado ao final
minRunners: 0
maxRunners: 2

template:
  spec:
    # ServiceAccount com permissão apenas no namespace "clima" (ver rbac/)
    serviceAccountName: clima-deployer
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
